<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أقساطي — مصادقة Google</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #fff; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.7; }
    .error { color: #f87171; margin-top: 16px; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #059669; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <!-- حالة التحميل -->
    <div id="loading">
      <div class="spinner"></div>
      <h1>جاري العودة إلى أقساطي...</h1>
      <p>يتم الآن إكمال عملية المصادقة</p>
    </div>

    <!-- حالة الخطأ -->
    <div id="error-state" class="hidden">
      <h1>⚠️ خطأ في المصادقة</h1>
      <p id="error-message" class="error"></p>
      <a href="javascript:window.close()" class="btn">إغلاق</a>
    </div>

    <!-- حالة النجاح (إذا لم يتم التوجيه تلقائياً) -->
    <div id="success-state" class="hidden">
      <h1>✅ تمت المصادقة بنجاح</h1>
      <p>إذا لم يتم فتح التطبيق تلقائياً، اضغط الزر أدناه:</p>
      <a id="open-app-link" href="#" class="btn">فتح أقساطي</a>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error');
      var errorDesc = params.get('error_description');

      var APP_SCHEME = 'com.installment.app';
      var CALLBACK_PATH = 'oauth/callback';

      function showError(msg) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error-state').classList.remove('hidden');
        document.getElementById('error-message').textContent = msg;
      }

      function showSuccess(appUrl) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('success-state').classList.remove('hidden');
        document.getElementById('open-app-link').href = appUrl;
      }

      // حالة الخطأ
      if (error) {
        var msg = error === 'access_denied'
          ? 'تم رفض الوصول. يرجى المحاولة مرة أخرى والسماح بالصلاحيات المطلوبة.'
          : (errorDesc || 'حدث خطأ أثناء المصادقة: ' + error);

        // إذا كان popup على الويب
        if (window.opener) {
          window.opener.postMessage({
            type: 'google-oauth-callback',
            error: error,
            errorDescription: errorDesc
          }, '*');
          setTimeout(function () { window.close(); }, 500);
          return;
        }

        showError(msg);
        return;
      }

      // لم يتم استلام code
      if (!code) {
        showError('لم يتم استلام بيانات المصادقة. يرجى المحاولة مرة أخرى.');
        return;
      }

      // ── Web Popup Flow ──
      if (window.opener) {
        try {
          window.opener.postMessage({
            type: 'google-oauth-callback',
            code: code,
            state: state
          }, '*');
          setTimeout(function () { window.close(); }, 500);
        } catch (e) {
          showError('تعذر إرسال البيانات. يرجى إغلاق هذه النافذة والمحاولة مرة أخرى.');
        }
        return;
      }

      // ── Native App Flow — redirect إلى Custom URL Scheme ──
      var callbackParams = new URLSearchParams();
      callbackParams.set('code', code);
      if (state) callbackParams.set('state', state);

      var appUrl = APP_SCHEME + '://' + CALLBACK_PATH + '?' + callbackParams.toString();

      // محاولة فتح التطبيق
      window.location.href = appUrl;

      // إذا لم ينجح التوجيه بعد 3 ثوانٍ، عرض زر يدوي
      setTimeout(function () {
        showSuccess(appUrl);
      }, 3000);
    })();
  </script>
</body>
</html>
